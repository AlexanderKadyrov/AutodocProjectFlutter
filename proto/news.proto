syntax = "proto3";

package autodoc.news;

message NewsItem {
  int32 id = 1;
  string title = 2;
  string description = 3;
  string published_date = 4;
  string category_url = 5;
  string image_url = 6;
}

message NewsRequest {
  int32 offset = 1;
  int32 limit = 2;
}

message NewsResponse {
  repeated NewsItem news = 1;
  int32 total_count = 2;
}